name: backend tests

on:
  push:
    branches-ignore: [main]   # main is built, tested and deployed by deploy-api.yml
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nurse_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/nurse_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Flyway migrates the empty database, then Hibernate checks every entity against the migrated schema
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Migrations on dirty legacy data
        env:
          PGPASSWORD: postgres
          PSQL_ARGS: -h localhost -U postgres
        run: scripts/verify-migrations.sh
      - name: Unit tests, integration tests and application context (Flyway + Hibernate validate on PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp test 2>&1 | tee mvn.log
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          {
            grep -E "ERROR|FAIL|Caused by|Tests run:.*Fail" mvn.log | head -60
            echo "--- surefire reports"
            grep -h -B1 -A12 -E "<<< (FAILURE|ERROR)" target/surefire-reports/*.txt 2>/dev/null | head -150
          } | cut -c1-600 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > annotation.txt
          echo "::error title=Maven failure::$(cat annotation.txt | head -c 60000)"
