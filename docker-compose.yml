version: '3.8'
services:
  app:
    image: nursepro-api:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nursepro_db
      - SPRING_DATASOURCE_USERNAME=nursepro
      - SPRING_DATASOURCE_PASSWORD=nursepro
    depends_on:
      - db
    networks:
      - nursepro-network
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nursepro_db
      POSTGRES_USER: nursepro
      POSTGRES_PASSWORD: nursepro
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Optional: for local PostgreSQL client access
    networks:
      - nursepro-network
networks:
  nursepro-network:
    driver: bridge
volumes:
  db-data:
