app:
  cors:
    allowed-origins:
      - "https://nursepro.vercel.app"
      - "https://*.vercel.app"
      - "https://*.onrender.com"
spring:
  datasource:
    url: jdbc:mysql://mysql-nurseschedulerpro.alwaysdata.net/nurseschedulerpro_db
    username: 429125
    password: "@nurs3pro.com"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # existing databases (created by ddl-auto=update) are baselined at 0, then V1 (no-op) and V2 run
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    jwt:
      secret: your-prod-jwt-secret-key
      expiration: 86400000
      refresh:
        expiration: 604800000 # 7 days in milliseconds
jwt:
  secret: your-prod-jwt-secret-key
  expiration: 86400000
  refresh:
    expiration: 604800000 # 7 days in milliseconds
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
springdoc:
  packages-to-scan: com.surf.nursepro.nurse_pro_api.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
logging:
  level:
    root: INFO
    com.surf.nursepro: INFO
    org.springframework: WARN
    org.springdoc: INFO