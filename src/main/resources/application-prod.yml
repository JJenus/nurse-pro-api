app:
  cors:
    allowed-origins:
      - "https://nursepro.vercel.app"
      - "https://*.vercel.app"
      - "https://*.onrender.com"
      - "https://nursepro.alwaysdata.net"
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql-nursepro.alwaysdata.net:5432/nursepro_pg_db?sslmode=require}
    username: ${DB_USERNAME:nursepro}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # databases created by ddl-auto=update are baselined at 0; V1 is a no-op there, V2+ then bring them up to date
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # batch-load lazy collections (shifts, assigned nurses) instead of one query per row
        default_batch_fetch_size: 100
  security:
    jwt:
      secret: your-prod-jwt-secret-key
      expiration: 86400000
      refresh:
        expiration: 604800000 # 7 days in milliseconds
jwt:
  secret: your-prod-jwt-secret-key
  expiration: 86400000
  refresh:
    expiration: 604800000 # 7 days in milliseconds
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
springdoc:
  packages-to-scan: com.surf.nursepro.nurse_pro_api.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
logging:
  level:
    root: INFO
    com.surf.nursepro: INFO
    org.springframework: WARN
    org.springdoc: INFO