app:
  cors:
    allowed-origins:
      - "https://nursepro.vercel.app"
      - "https://*.vercel.app"
      - "https://*.onrender.com"
      - "https://nursepro.alwaysdata.net"
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql-nursepro.alwaysdata.net:5432/nursepro_pg_db?sslmode=require}
    username: ${DB_USERNAME:nursepro}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    jwt:
      secret: your-prod-jwt-secret-key
      expiration: 86400000
      refresh:
        expiration: 604800000 # 7 days in milliseconds
jwt:
  secret: your-prod-jwt-secret-key
  expiration: 86400000
  refresh:
    expiration: 604800000 # 7 days in milliseconds
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
springdoc:
  packages-to-scan: com.surf.nursepro.nurse_pro_api.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
logging:
  level:
    root: INFO
    com.surf.nursepro: INFO
    org.springframework: WARN
    org.springdoc: INFO