#dev.yml
app:
  cors:
    allowed-origins:
      - "http://localhost:*"
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nurse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # existing databases (created by ddl-auto=update) are baselined at 0, then V1 (no-op) and V2 run
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # batch-load lazy collections (shifts, assigned nurses) instead of one query per row
        default_batch_fetch_size: 100
jwt:
  secret: your-secure-jwt-secret-key-here-32-chars-minimum
  expiration: 86400000 # 24 hours in milliseconds
  refresh:
    expiration: 604800000 # 7 days in milliseconds
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
springdoc:
  packages-to-scan: com.surf.nursepro.nurse_pro_api.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
logging:
  level:
    root: INFO
    com.surf.nursepro: DEBUG
    org.springdoc: DEBUG